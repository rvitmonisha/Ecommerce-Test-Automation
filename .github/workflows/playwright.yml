
name: E-Commerce Automation Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 90
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # 3. Setup Java for Allure
      - name: Setup Java for Allure
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 4. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 5. Run ESLint
      - name: Run ESLint
        run: npm run lint

      # 6. Install all Playwright browsers
      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # 7. Run functional and API tests on Chromium, Firefox and WebKit
      - name: Run cross-browser functional and API tests
        run: npx playwright test --workers=1 --grep-invert "Check homepage accessibility"

      # 8. Run accessibility tests separately
      - name: Run accessibility tests
        if: always()
        continue-on-error: true
        run: npx playwright test tests/accessibility.spec.ts --project=chromium --workers=1

      # 9. Generate Allure report
      - name: Generate Allure report
        if: always()
        run: npx allure generate allure-results --clean -o allure-report

      # 10. Upload Allure report
      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30

      # 11. Upload Playwright test results
      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 30
